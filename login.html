<!DOCTYPE html>
<html lang="pt-BR" class="t-onyx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · AgendaTop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--bg);font-family:var(--font-b);padding:16px;color:var(--tx)}
    .card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-xl);
      padding:36px 28px;width:100%;max-width:380px;box-shadow:var(--sh-lg)}
    .logo{text-align:center;font-size:36px;margin-bottom:8px}
    h1{text-align:center;font-size:20px;font-weight:800;color:var(--tx);margin-bottom:4px}
    .sub{text-align:center;font-size:13px;color:var(--tx3);margin-bottom:28px}
    .fg{margin-bottom:16px}
    .fl{display:block;font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:6px;
      text-transform:uppercase;letter-spacing:.05em}
    .fi{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);
      color:var(--tx);font-size:15px;padding:12px 14px;outline:none;font-family:inherit;
      transition:border-color .15s}
    .fi:focus{border-color:var(--primary)}
    .pin-wrap{display:flex;gap:10px;justify-content:center;margin-top:4px;
      cursor:text;position:relative;user-select:none}
    .pin-dot{width:64px;height:64px;background:var(--s2);border:2px solid var(--bd);
      border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;
      font-size:32px;line-height:1;color:var(--primary);transition:all .12s}
    .pin-dot.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
    .pin-dot.filled{background:var(--primary-bg);border-color:var(--primary)}
    #pinReal{position:absolute;opacity:0;width:1px;height:1px;top:0;left:0;pointer-events:none}
    .btn-sv{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;
      border-radius:var(--r-md);font-size:15px;font-weight:700;cursor:pointer;
      margin-top:20px;transition:background .15s;font-family:inherit}
    .btn-sv:hover:not(:disabled){background:var(--primary-d)}
    .btn-sv:disabled{opacity:.45;cursor:not-allowed}
    .err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none;
      background:var(--red-bg);padding:10px 12px;border-radius:var(--r-md)}
    .alt{text-align:center;margin-top:22px;font-size:12px;color:var(--tx3)}
    .alt a{color:var(--primary);text-decoration:none}
    .sep{height:1px;background:var(--bd);margin:24px 0}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✂️</div>
    <h1>Acessar agenda</h1>
    <p class="sub">Código do salão + PIN de 4 dígitos</p>

    <div class="fg">
      <label class="fl" for="inpSlug">Código do salão</label>
      <input class="fi" type="text" id="inpSlug" placeholder="ex: bella-arte"
             autocorrect="off" autocapitalize="none" spellcheck="false"
             onkeydown="if(event.key==='Enter')document.getElementById('pinWrap').focus()">
    </div>

    <div class="fg">
      <label class="fl">PIN</label>
      <div class="pin-wrap" id="pinWrap" tabindex="0"
           onclick="document.getElementById('pinReal').focus()"
           onfocus="document.getElementById('pinReal').focus()">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
        <input id="pinReal" type="tel" inputmode="numeric" maxlength="4"
               autocomplete="one-time-code"
               oninput="onPin(this.value)"
               onkeydown="onPinKey(event)">
      </div>
    </div>

    <button class="btn-sv" id="btnLogin" onclick="doLogin()" disabled>Entrar</button>
    <div class="err" id="errMsg"></div>
    <div class="sep"></div>
    <div class="alt">Dono do salão? <a href="/painel.html">Acessar painel completo</a></div>
  </div>

  <script>
    const SUPA = 'https://acldrisohnjfekjxgmoh.supabase.co';
    const KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjbGRyaXNvaG5qZmVranhnbW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1ODA1MzcsImV4cCI6MjA4OTE1NjUzN30.etojz12x1oVNvbW_fPeVpNx2OFuJ72C1YioFBlCLS2Y';
    const SK   = 'prof_sessao';

    // Redirect if already logged in
    try {
      var s0 = JSON.parse(localStorage.getItem(SK)||'null');
      if (s0 && s0.profissional) {
        location.replace(s0.profissional.papel === 'recepcao' ? '/recepcao.html' : '/minha-agenda.html');
      }
    } catch(e) {}

    // Restore slug from last login
    var savedSlug = localStorage.getItem('prof_slug') || '';
    if (savedSlug) document.getElementById('inpSlug').value = savedSlug;

    var pin = '';

    function onPin(val) {
      pin = val.replace(/\D/g,'').slice(0,4);
      document.getElementById('pinReal').value = pin;
      for (var i = 0; i < 4; i++) {
        var d = document.getElementById('pd'+i);
        if (i < pin.length)      { d.textContent='●'; d.className='pin-dot filled'; }
        else if (i === pin.length){ d.textContent='';  d.className='pin-dot active'; }
        else                      { d.textContent='';  d.className='pin-dot'; }
      }
      document.getElementById('btnLogin').disabled = pin.length < 4;
      if (pin.length === 4) doLogin();
    }

    function onPinKey(e) {
      if (e.key === 'Backspace' && pin.length > 0) {
        pin = pin.slice(0,-1);
        document.getElementById('pinReal').value = pin;
        onPin(pin);
      }
    }

    async function doLogin() {
      var slug = document.getElementById('inpSlug').value.trim().toLowerCase();
      var errEl = document.getElementById('errMsg');
      errEl.style.display = 'none';
      if (!slug) { errEl.textContent='Informe o código do salão.'; errEl.style.display='block'; return; }
      if (pin.length < 4) { errEl.textContent='PIN incompleto.'; errEl.style.display='block'; return; }
      var btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        var r = await fetch(SUPA+'/rest/v1/rpc/login_profissional', {
          method:'POST',
          headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
          body: JSON.stringify({p_salao_slug:slug, p_pin:pin})
        });
        var data = await r.json();
        if (!r.ok || !data.ok) throw new Error(data.erro || data.message || 'PIN ou slug incorretos');
        localStorage.setItem(SK, JSON.stringify({
          salao: data.salao, profissional: data.profissional, entrouEm: new Date().toISOString()
        }));
        localStorage.setItem('prof_slug', slug);
        location.replace(data.profissional.papel === 'recepcao' ? '/recepcao.html' : '/minha-agenda.html');
      } catch(ex) {
        errEl.textContent = ex.message || 'Erro desconhecido';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
